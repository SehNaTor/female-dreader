<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Female Dreader Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .settings-card {
      background-color: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: var(--admin-radius-lg);
      padding: 2rem;
      box-shadow: var(--admin-shadow-sm);
      max-width: 800px;
    }
  </style>
</head>
<body>

  <div class="admin-page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h2 style="margin: 0; font-size: 1.5rem;">Business Settings</h2>
      <p class="text-muted" style="margin-top: 0.25rem; font-size: 0.95rem;">Configure global business information and preferences.</p>
    </div>
  </div>
  
  <div id="settings-container">
    <div class="admin-loader" id="settings-loader"></div>
    
    <div class="settings-card" id="settings-form-wrapper" style="display: none;">
      <form id="settings-form" novalidate>
        
        <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--admin-border); padding-bottom: 0.5rem;">General Information</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="admin-form-group">
            <label class="admin-form-label">Business Name</label>
            <input type="text" id="business_name" class="admin-form-input" required>
          </div>
          
          <div class="admin-form-group">
            <label class="admin-form-label">Contact Email</label>
            <input type="email" id="contact_email" class="admin-form-input" required>
          </div>

          <div class="admin-form-group">
            <label class="admin-form-label">Phone Number</label>
            <input type="text" id="phone_number" class="admin-form-input">
          </div>
          
          <div class="admin-form-group">
            <label class="admin-form-label">WhatsApp Number</label>
            <input type="text" id="whatsapp_number" class="admin-form-input" placeholder="+234...">
          </div>
        </div>

        <div class="admin-form-group" style="margin-top: 0.5rem;">
          <label class="admin-form-label">Business Address</label>
          <textarea id="address" class="admin-form-input" rows="2"></textarea>
        </div>

        <h3 style="margin-top: 2rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--admin-border); padding-bottom: 0.5rem;">Social Media Links</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="admin-form-group">
            <label class="admin-form-label"><i class="fa-brands fa-instagram text-muted"></i> Instagram URL</label>
            <input type="url" id="instagram_url" class="admin-form-input">
          </div>
          
          <div class="admin-form-group">
            <label class="admin-form-label"><i class="fa-brands fa-facebook text-muted"></i> Facebook URL</label>
            <input type="url" id="facebook_url" class="admin-form-input">
          </div>
        </div>

        <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
          <button type="submit" class="admin-btn admin-btn--gold" id="save-settings-btn">
            <i class="fa-solid fa-save"></i> Save Settings
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lenis Smooth Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="../js/scroll/scroll-init.js"></script>

  <script type="module" src="js/settings.js"></script>
</body>
</html>
