<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management - Female Dreader Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="admin-page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h2 style="margin: 0; font-size: 1.5rem;">Orders</h2>
      <p class="text-muted" style="margin-top: 0.25rem; font-size: 0.95rem;">Manage e-commerce product orders.</p>
    </div>
  </div>
  
  <div class="admin-toolbar" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
    <div class="admin-form-group" style="margin: 0; flex-grow: 1; max-width: 340px; position: relative;">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--admin-text-muted);"></i>
      <input type="text" id="search-orders" class="admin-form-input" placeholder="Search by Order ID, name, or phone..." style="padding-left: 2.5rem;">
    </div>
    
    <select id="filter-payment" class="admin-form-input" style="max-width: 200px;">
      <option value="All">All Payment Statuses</option>
      <option value="Pending">Pending</option>
      <option value="Paid">Paid</option>
      <option value="Failed">Failed</option>
      <option value="Refunded">Refunded</option>
    </select>

    <select id="filter-status" class="admin-form-input" style="max-width: 200px;">
      <option value="All">All Order Statuses</option>
      <option value="Pending">Pending</option>
      <option value="Processing">Processing</option>
      <option value="Shipped">Shipped</option>
      <option value="Delivered">Delivered</option>
      <option value="Cancelled">Cancelled</option>
    </select>
  </div>

  <div id="orders-table-container">
    <div class="admin-loader"></div>
  </div>

  <!-- Order Details Modal -->
  <div id="order-modal" class="admin-modal">
    <div class="admin-modal__backdrop"></div>
    <div class="admin-modal__content" style="max-width: 800px;">
      <div class="admin-modal__header">
        <h3 class="admin-modal__title">Order Details</h3>
        <button class="admin-modal__close" aria-label="Close modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="admin-modal__body" id="order-modal-body">
        <!-- Content will be injected here via JS -->
      </div>
      <div class="admin-modal__footer" style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
        <button class="admin-btn admin-btn--outline" id="btn-close-modal">Cancel</button>
        <button class="admin-btn admin-btn--primary" id="btn-save-order">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Lenis Smooth Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="../js/scroll/scroll-init.js"></script>

  <script type="module" src="js/orders.js"></script>
</body>
</html>
